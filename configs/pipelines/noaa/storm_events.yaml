name: noaa.storm_events
source:
  type: noaa.storm_events
# schema defaults to schemas/noaa/storm_events/storm_events.schema.yaml
validation:
  engine: jsonschema
ingestion:
  library: det
destination:
  type: iceberg
  # ETL default: identity on __extract_run_datetime (omit = extract_run).
  partition: extract_run
medallion:
  bronze_prefix: bronze
  raw_prefix: raw
# Stamp on raw manifests and lake id suffix ({name}_vN, including _v1).
# Bump wire_version on true wire/parse breaks; rebuild older raw with det migrate.
wire_version: 1
dbt:
  silver:
    materialized: incremental
    unique_key: [__row_hash]
    order_by: ["__extract_run_datetime desc"]
    incremental_strategy: delete+insert
    watermark: __extract_run_datetime
    lookback: null
slo:
  cadence: daily
  max_error_rate: 0
  p95_ms: 600000
  load:
    p95_ms: 900000
