name: noaa.locations
source:
  type: noaa.locations
  # defaults: url + filename_substr=locations-ftp (StormEvents_locations-ftp_*.csv.gz)
  # overrides:
  #   local_csv_dir: fixtures/locations
# schema defaults to schemas/noaa/locations/locations.schema.yaml
validation:
  engine: jsonschema
ingestion:
  library: det
destination:
  type: iceberg
medallion:
  bronze_prefix: bronze
  raw_prefix: raw
# Stamp on raw manifests and lake id suffix ({name}_vN, including _v1).
# Bump wire_version on true wire/parse breaks; rebuild older raw with det migrate.
wire_version: 1
dbt:
  silver:
    materialized: table
    unique_key: [__row_hash]
    order_by: ["__extract_run_datetime desc"]
    incremental_strategy: delete+insert
    watermark: __extract_run_datetime
    lookback: null
