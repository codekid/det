name: noaa.fatalities
source:
  type: noaa.fatalities
  # defaults: url + filename_substr=fatalities-ftp (StormEvents_fatalities-ftp_*.csv.gz)
  # overrides:
  #   local_csv_dir: fixtures/fatalities
# schema defaults to schemas/noaa/fatalities/fatalities.schema.yaml
validation:
  engine: jsonschema
ingestion:
  library: det
destination:
  type: filesystem
  path: ./data/lake
medallion:
  bronze_prefix: bronze
  raw_prefix: raw
wire_version: 1
dbt:
  silver:
    materialized: table
    unique_key: [__row_hash]
    order_by: ["__extract_run_datetime desc"]
    incremental_strategy: delete+insert
    watermark: __extract_run_datetime
    lookback: null
