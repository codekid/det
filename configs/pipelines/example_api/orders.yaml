name: example_api.orders
source:
  type: example_api.orders
  # defaults (base_url, fixture_records, …) live in example_api/orders.py
  # Offline demo uses built-in fixture_records. For live HTTP:
  #   overrides:
  #     fixture_records: null
  #     base_url: https://staging.api.example.com
validation:
  engine: jsonschema
ingestion:
  library: det
destination:
  type: iceberg
  # Small table — unpartitioned; large feeds use extract_run (Iceberg default).
  partition: none
medallion:
  bronze_prefix: bronze
  raw_prefix: raw
# Stamp on raw manifests and lake id suffix ({name}_vN, including _v1).
# Bump wire_version on true wire/parse breaks; rebuild older raw with det migrate.
wire_version: 1
