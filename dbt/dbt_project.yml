name: "analytics"
version: "1.0.0"
config-version: 2
profile: "analytics"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics:
    silver:
      # Per-model schema=silver_{provider} from scaffold (see generate_schema_name).
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
    ops:
      +tags: [ops]
      +schema: ops
      # Table (not view): Iceberg scan is cwd-sensitive; persist rows in DET_OPS_DUCKDB.
      +materialized: table

seeds:
  analytics:
    ops_slo_expected:
      +schema: ops
      +tags: [ops]
      +column_types:
        pipeline: varchar
        command: varchar
        cadence: varchar
        recency_hours: integer
        score_hours: integer
        max_error_rate: double
        p95_ms: integer
