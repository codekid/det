name: "analytics"
version: "1.0.0"
config-version: 2
profile: "analytics"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  analytics:
    silver:
      # Per-model schema=silver_{provider} from scaffold (see generate_schema_name).
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
    ops:
      +tags: [ops]
      +schema: ops
      # Table (not view): DuckDB iceberg_scan is cwd-sensitive; BQ ops uses BigLake.
      +materialized: table

seeds:
  analytics:
    ops_slo_expected:
      +schema: ops
      +tags: [ops]
      +column_types:
        pipeline: "{% if target.name == 'bigquery' %}string{% else %}varchar{% endif %}"
        command: "{% if target.name == 'bigquery' %}string{% else %}varchar{% endif %}"
        cadence: "{% if target.name == 'bigquery' %}string{% else %}varchar{% endif %}"
        recency_hours: "{% if target.name == 'bigquery' %}int64{% else %}integer{% endif %}"
        score_hours: "{% if target.name == 'bigquery' %}int64{% else %}integer{% endif %}"
        max_error_rate: "{% if target.name == 'bigquery' %}float64{% else %}double{% endif %}"
        p95_ms: "{% if target.name == 'bigquery' %}int64{% else %}integer{% endif %}"
