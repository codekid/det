              columns={'id': 'VARCHAR', 'occurred_at': 'VARCHAR', 'severity': 'VARCHAR', 'level': 'VARCHAR', 'severity_level': 'VARCHAR', 'state': 'VARCHAR', 'status': 'VARCHAR', 'debug_info': 'VARCHAR', '__row_hash': 'VARCHAR', '__filename': 'VARCHAR', '__extract_run_datetime': 'TIMESTAMP', '__interval_start_datetime': 'TIMESTAMP', '__interval_end_datetime': 'TIMESTAMP', '__data_interval_date': 'DATE'},
              union_by_name=true,
              hive_partitioning=false
            )
        columns:
        - name: __row_hash
          tests:
          - not_null
        - name: id
          tests:
          - not_null
        - name: occurred_at
          tests:
          - not_null

