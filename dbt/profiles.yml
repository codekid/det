analytics:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      # Prefer absolute DET_ANALYTICS_DUCKDB in Airflow/Compose.
      # Default keeps local `cd dbt && dbt …` working.
      path: "{{ env_var('DET_ANALYTICS_DUCKDB', '../data/analytics.duckdb') }}"
      schema: main
      # File-backed DuckDB: one writer; keep dbt single-threaded.
      threads: 1
      extensions:
        - httpfs
        - iceberg
    duckdb_s3:
      type: duckdb
      path: "{{ env_var('DET_ANALYTICS_DUCKDB', '../data/analytics.duckdb') }}"
      schema: main
      threads: 1
      extensions:
        - httpfs
        - iceberg
      secrets:
        - type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('DET_DUCKDB_S3_ENDPOINT', '') }}"
          url_style: path
          use_ssl: "{{ env_var('DET_DUCKDB_S3_USE_SSL', 'false') }}"
    ops:
      type: duckdb
      # File stem must not be `ops` — DuckDB names the catalog after the file,
      # which collides with +schema: ops (`ops.stg_…` becomes ambiguous).
      path: "{{ env_var('DET_OPS_DUCKDB', '../data/det_ops.duckdb') }}"
      schema: main
      threads: 1
      extensions:
        - httpfs
        - iceberg
