[project]
name = "det"
version = "0.1.0"
description = "DET — Data Extract Tool: config-driven extraction runtime with pluggable ingestion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "jsonschema>=4.23.0",
    "pendulum>=3.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "structlog>=25.1.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
examples = [
    "beautifulsoup4>=4.12.0",
    "dlt[filesystem]>=1.24.0",
]
duckdb = [
    "duckdb>=1.5.1",
]
scaffold = [
    "jinja2>=3.1.0",
]
dbt = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]
bigquery = [
    "dbt-bigquery>=1.9",
    "google-cloud-bigquery>=3.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "s3fs>=2024.0.0",
]
gcs = [
    "gcsfs>=2024.0.0",
]
iceberg = [
    "pyiceberg>=0.8",
    "pyarrow>=15",
]
mcp = [
    # FastMCP lives in mcp 1.x; mcp 2.0 replaced it with MCPServer.
    "mcp>=1.2,<2",
]

[project.scripts]
det = "det.cli:app"
det-mcp = "det.mcp.server:main"

# In-tree sources/mappers are discovered from det.sources.<provider>.<source>.
# Out-of-tree packages only — do not list in-tree plugins here.
[project.entry-points."det.sources"]

[project.entry-points."det.mappers"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
det = ["py.typed", "scaffold/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: slower end-to-end tests",
    "postgres: live Postgres (skipped unless DET_POSTGRES_DSN is set)",
    "minio: live MinIO/S3 (skipped unless AWS_ENDPOINT_URL is set)",
    "gcs: live GCS emulator (skipped unless STORAGE_EMULATOR_HOST is set)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["det"]

# Narrow public-surface typecheck (CI). Follow imports but only report on these paths.
[tool.pyright]
include = ["src/det/__init__.py", "src/det/sources/http.py", "src/det/sources/http_json.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
