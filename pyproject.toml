[project]
name = "det-elt"
version = "0.2.0"
description = "DET — Data Extract Tool: config-driven extraction runtime with pluggable ingestion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kadeem", email = "kletts2000@gmail.com" }]
keywords = ["etl", "data-extraction", "pipeline", "iceberg", "bronze"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "jsonschema>=4.23.0",
    "pendulum>=3.0.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "structlog>=25.1.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]
examples = [
    "beautifulsoup4>=4.12.0",
    "dlt[filesystem]>=1.24.0",
]
duckdb = [
    "duckdb>=1.5.1",
]
scaffold = [
    "jinja2>=3.1.0",
]
dbt = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]
bigquery = [
    "dbt-bigquery>=1.9",
    "google-cloud-bigquery>=3.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "s3fs>=2024.0.0",
]
gcs = [
    "gcsfs>=2024.0.0",
]
iceberg = [
    "pyiceberg>=0.8",
    "pyarrow>=15",
]
mcp = [
    # FastMCP lives in mcp 1.x; mcp 2.0 replaced it with MCPServer.
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/codekid/det"
Repository = "https://github.com/codekid/det"
Issues = "https://github.com/codekid/det/issues"
Documentation = "https://github.com/codekid/det/blob/main/docs/getting-started-library.md"

[project.scripts]
det = "det.cli:app"
det-mcp = "det.mcp.server:main"

# In-tree sources/mappers are discovered from det.sources.<provider>.<source>.
# Out-of-tree packages only — do not list in-tree plugins here.
[project.entry-points."det.sources"]

[project.entry-points."det.mappers"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
det = [
    "py.typed",
    "scaffold/templates/*.j2",
    "scaffold/templates/ops/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: slower end-to-end tests",
    "postgres: live Postgres (skipped unless DET_POSTGRES_DSN is set)",
    "minio: live MinIO/S3 (skipped unless AWS_ENDPOINT_URL is set)",
    "gcs: live GCS emulator (skipped unless STORAGE_EMULATOR_HOST is set)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Typer idiom: Option()/Argument() as defaults.
"src/det/cli/**/*.py" = ["B008"]
# SQL is built from quote_ident / fixed meta columns; values are bound params.
"src/det/ingestion/duckdb_writer.py" = ["S608"]
"src/det/ingestion/postgres_writer.py" = ["S608"]
"src/det/runtime/lease/postgres_store.py" = ["S608"]
"src/det/ingestion/sql_ddl.py" = ["S608"]
"src/det/ingestion/sql_replace.py" = ["S608"]
"src/det/mcp/inspect/**/*.py" = ["S608"]
"src/det/mcp/query_sql.py" = ["S608"]
"src/det/runtime/prune.py" = ["S608"]
# Pytest asserts / fixture secrets / intentional SQL and subprocess tests.
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603", "S607", "S608", "S701", "B017"]
"scripts/**/*.py" = ["S101"]
# Local Airflow DAGs: assert for conf, subprocess to det CLI, bool/1 conf dual.
"dags/**/*.py" = ["S101", "S603", "B033"]

[tool.ruff.lint.isort]
known-first-party = ["det"]

# Coverage ratchet (CI fail_under). Raise over time; never lower without cause.
[tool.coverage.run]
source = ["det"]
branch = false
omit = [
    "*/det/mcp/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Set in PR1 after measuring clean main; ratchet upward only.
fail_under = 81

# Narrow public-surface typecheck (CI). Follow imports but only report on these paths.
[tool.pyright]
include = [
    "src/det/__init__.py",
    "src/det/errors.py",
    "src/det/plugins.py",
    "src/det/optional_deps.py",
    "src/det/logging.py",
    "src/det/validation",
    "src/det/destinations",
    "src/det/sources",
    "src/det/ingestion",
    "src/det/testing",
    "src/det/runtime/manifest_types.py",
    "src/det/runtime/receipt_types.py",
    "src/det/runtime/layout.py",
    "src/det/runtime/ids.py",
    "src/det/runtime/naming.py",
    "src/det/runtime/meta.py",
    "src/det/runtime/mappers.py",
    "src/det/runtime/dlt_hygiene.py",
    "src/det/runtime/coerce.py",
    "src/det/runtime/object_store.py",
    "src/det/runtime/slo.py",
    "src/det/runtime/discovery.py",
    "src/det/runtime/secrets.py",
    "src/det/runtime/sql_types.py",
    "src/det/runtime/approval.py",
    "src/det/runtime/lake.py",
    "src/det/runtime/manifest.py",
    "src/det/runtime/lease",
    "src/det/runtime/registry.py",
    "src/det/runtime/config.py",
    "src/det/runtime/pipelines.py",
    "src/det/runtime/load_rows.py",
    "src/det/runtime/settings.py",
    "src/det/runtime/runner.py",
    "src/det/runtime/migrate.py",
    "src/det/runtime/receipts.py",
    "src/det/runtime/receipts_materialize.py",
    "src/det/runtime/prune.py",
    "src/det/runtime/check.py",
    "src/det/runtime/dbt_runner.py",
    "src/det/runtime/biglake_register.py",
    "src/det/cli",
    "src/det/scaffold",
    "src/det/mcp",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
