name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        # mcp extra required for tests/mcp; avoid --system (PEP 668 on ubuntu-latest)
        run: uv sync --extra dev --extra mcp
      - name: Lint
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q
