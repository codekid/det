name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: det
          POSTGRES_PASSWORD: det
          POSTGRES_DB: det
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U det -d det"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Approvals on by default. CI runs no writing det commands (only det check,
      # dbt parse, pytest), and tests/conftest.py clears this so suites must opt
      # in explicitly rather than inherit ambient CI env.
      DET_REQUIRE_APPROVAL: "1"
      DET_POSTGRES_DSN: postgresql://det:det@localhost:5432/det
      DET_LAKE_MODE: local
      DET_LAKE_PATH: ${{ github.workspace }}/data/lake
      DET_ANALYTICS_DUCKDB: ${{ github.workspace }}/data/analytics.duckdb
      DET_OPS_DUCKDB: ${{ github.workspace }}/data/det_ops.duckdb
      # MinIO soak (tests/integration/test_minio_iceberg_soak.py); main suite stays local.
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      DET_MINIO_BUCKET: det-ci
      # Polaris REST catalog soak (tests/integration/test_polaris_iceberg_soak.py).
      DET_ICEBERG_REST_URI: http://127.0.0.1:8181/api/catalog
      DET_ICEBERG_REST_WAREHOUSE: det_lake
      DET_ICEBERG_REST_CREDENTIAL: root:s3cr3t
      DET_ICEBERG_REST_SCOPE: PRINCIPAL_ROLE:ALL
      DET_ICEBERG_REST_REALM: POLARIS
      # GCS soak (tests/integration/test_gcs_iceberg_soak.py); fake-gcs-server /
      # localgcp both honor STORAGE_EMULATOR_HOST.
      STORAGE_EMULATOR_HOST: http://127.0.0.1:4443
      GOOGLE_CLOUD_PROJECT: det-local
      DET_GCS_BUCKET: det-ci
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start MinIO + Polaris
        # Shared MinIO for -m minio and -m polaris (docker/polaris-minio).
        run: |
          docker compose -f docker/polaris-minio/docker-compose.yml up -d --wait
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live \
              && curl -sf http://127.0.0.1:8182/q/health; then
              echo "minio+polaris ready"
              exit 0
            fi
            sleep 2
          done
          echo "minio/polaris failed to become healthy" >&2
          docker compose -f docker/polaris-minio/docker-compose.yml logs >&2 || true
          exit 1
      - name: Start fake-gcs-server
        # STORAGE_EMULATOR_HOST-compatible (same env as localgcp GCS).
        run: |
          docker run -d --name det-gcs \
            -p 4443:4443 \
            fsouza/fake-gcs-server:latest \
            -scheme http -port 4443 -external-url http://127.0.0.1:4443
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4443/storage/v1/b"; then
              echo "fake-gcs ready"
              exit 0
            fi
            sleep 1
          done
          echo "fake-gcs failed to become healthy" >&2
          docker logs det-gcs >&2 || true
          exit 1
      - name: Install
        # mcp + examples/duckdb/scaffold: product extras; dbt + postgres match prod.
        # s3 + gcs + iceberg: object-lake soaks.
        # bigquery: BigLake connection-SA lookup path (skipped without it).
        # avoid --system (PEP 668 on ubuntu-latest)
        run: >
          uv sync
          --extra dev --extra mcp --extra dbt --extra postgres
          --extra iceberg --extra s3 --extra gcs
          --extra examples --extra duckdb --extra scaffold
          --extra bigquery
      - name: Lint
        run: uv run ruff check .
      - name: Structure check
        run: uv run det check --strict
      - name: No committed credentials
        # det check parses pipeline YAML; this also covers files it never loads
        # (dbt/profiles.yml). Matches scheme://user:pass@host. airflow/ is excluded:
        # Compose ships throwaway local metadata-db defaults on purpose.
        run: |
          if grep -rInE '[a-z][a-z0-9+.-]*://[^/[:space:]"'"'"']+:[^/[:space:]"'"'"']+@' \
            configs dbt; then
            echo "::error::credentials found in committed config (use *_env names)"
            exit 1
          fi
      - name: dbt parse
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt
      - name: Pytest
        run: uv run pytest -q --cov=det --cov-report=term-missing:skip-covered

  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install base only
        run: uv sync
      - name: Import + filesystem bronze smoke
        run: uv run python scripts/minimal_install_smoke.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (typed public surface)
        run: >
          uv sync --extra duckdb --extra iceberg --extra postgres
          --extra scaffold --extra examples --extra mcp --extra dbt
          --extra bigquery
      - name: Narrow pyright on public modules
        run: uvx --from basedpyright basedpyright

  packaging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Build sdist and wheel
        run: |
          uv pip install build
          uv run python -m build
      - name: Wheel install smoke
        run: |
          uv venv /tmp/det-wheel-smoke
          uv pip install --python /tmp/det-wheel-smoke/bin/python dist/*.whl
          /tmp/det-wheel-smoke/bin/python scripts/minimal_install_smoke.py
