# Publish det-elt to PyPI when a GitHub Release is published.
#
# One-time PyPI setup (https://pypi.org/manage/project/det-elt/settings/publishing/):
#   - Add a trusted publisher: owner codekid, repo det, workflow publish.yml
#   - Create the det-elt project on PyPI first (or let first upload create it)
#
# Release: tag v0.2.0, push tag, create GitHub Release from the tag.

name: publish

on:
  release:
    types: [published]

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          EXPECTED="v${VERSION}"
          ACTUAL="$RELEASE_TAG"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read project.version from pyproject.toml"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release tag ${ACTUAL} does not match pyproject.toml version ${VERSION} (expected ${EXPECTED})"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Build sdist and wheel
        run: |
          uv pip install build
          uv run python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  pypi:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
