# DET local Airflow (LocalExecutor + UI). Dev only — not for production.
#
# Usage (from repo root):
#   make airflow-up
#   open http://localhost:8080  (airflow / airflow)
#   make airflow-down
#
# Env: copy airflow/.env.example → airflow/.env

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__COSMOS__ENABLE_TELEMETRY: "false"
    DET_PROJECT_ROOT: /opt/det
    DET_PIPELINE_CONFIG: ${DET_PIPELINE_CONFIG:-noaa.storm_events}
    DET_LAKE_PATH: /opt/det/data/lake
    DET_LOG_FORMAT: json
    DET_ANALYTICS_DUCKDB: /opt/det/data/analytics.duckdb
    DET_DBT_PROJECT: /opt/det/dbt
    # Defaults for noaa.storm_events filesystem bronze; DAG may refine from pipeline YAML.
    DET_BRONZE_SOURCE: ${DET_BRONZE_SOURCE:-filesystem}
    DET_BRONZE_SCHEMA: ${DET_BRONZE_SCHEMA:-bronze_noaa}
    DET_PIPELINE_OVERRIDES: ${DET_PIPELINE_OVERRIDES:-}
    DET_PRUNE: ${DET_PRUNE:-}
    DET_PRUNE_APPLY: ${DET_PRUNE_APPLY:-}
    DET_PRUNE_KEEP: ${DET_PRUNE_KEEP:-1}
  volumes:
    - ..:/opt/det
    - ../dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        mkdir -p /sources/logs /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,plugins}
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname DET \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - ..:/opt/det
      - ../dags:/opt/airflow/dags
      - ./logs:/sources/logs
      - ./plugins:/sources/plugins

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-db-volume:
